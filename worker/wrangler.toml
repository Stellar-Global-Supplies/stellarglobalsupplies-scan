name               = "scan-worker"
main               = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled           = true
head_sampling_rate = 1

# ── D1 Database ────────────────────────────────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "scan-db"
database_id   = "7326e870-5056-4bb1-88a8-34bd8374bd18"
# wrangler d1 create scan-db

# ── Cloudflare Queues ──────────────────────────────────────────────────────────
[[queues.producers]]
binding = "SCAN_QUEUE"
queue   = "scan-queue"

[[queues.consumers]]
queue             = "scan-queue"
max_batch_size    = 5
max_batch_timeout = 30
max_retries       = 3
dead_letter_queue = "scan-queue-dlq"

# ── Non-secret vars ────────────────────────────────────────────────────────────
[vars]
FRONTEND_URL = "https://scan.stellarglobalsupplies.com"

# ── Secrets Store ──────────────────────────────────────────────────────────────
# Binds directly into env.* — Usage: const token = await env.GITHUB_TOKEN.get()
# Uses your existing store: 2556bcd9458349f6b4ff2a3fc93bdba1
#
#   wrangler secrets-store secret create GITHUB_TOKEN --store-id 2556bcd9458349f6b4ff2a3fc93bdba1 --value "..."

[[secrets_store_secrets]]
binding     = "GITHUB_TOKEN"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "GITHUB_TOKEN"