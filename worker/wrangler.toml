name               = "scan-worker"
main               = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled           = true
head_sampling_rate = 1

# ── D1 Database ────────────────────────────────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "scan-db"
database_id   = "7326e870-5056-4bb1-88a8-34bd8374bd18"
# wrangler d1 create scan-db

# ── Cloudflare Queues ──────────────────────────────────────────────────────────
[[queues.producers]]
binding = "SCAN_QUEUE"
queue   = "scan-queue"

[[queues.consumers]]
queue             = "scan-queue"
max_batch_size    = 5
max_batch_timeout = 30
max_retries       = 3
dead_letter_queue = "scan-queue-dlq"

# ── Non-secret vars ────────────────────────────────────────────────────────────
[vars]
FRONTEND_URL = "https://scan.stellarglobalsupplies.com"

# ── Secrets Store ──────────────────────────────────────────────────────────────
# Each [[secrets_store_secrets]] block binds one secret directly into env.*
# Uses your existing store: 2556bcd9458349f6b4ff2a3fc93bdba1
#
# Add secrets to the store:
#   wrangler secrets-store secret create SNYK_API_TOKEN      --store-id 2556bcd9458349f6b4ff2a3fc93bdba1 --value "..."
#   wrangler secrets-store secret create SNYK_ORG_ID         --store-id 2556bcd9458349f6b4ff2a3fc93bdba1 --value "..."
#   wrangler secrets-store secret create GITHUB_TOKEN        --store-id 2556bcd9458349f6b4ff2a3fc93bdba1 --value "..."
#   wrangler secrets-store secret create SONARCLOUD_TOKEN    --store-id 2556bcd9458349f6b4ff2a3fc93bdba1 --value "..."
#   wrangler secrets-store secret create SONARCLOUD_ORG      --store-id 2556bcd9458349f6b4ff2a3fc93bdba1 --value "..."

[[secrets_store_secrets]]
binding     = "SNYK_API_TOKEN"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "SNYK_API_TOKEN"

[[secrets_store_secrets]]
binding     = "SNYK_ORG_ID"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "SNYK_ORG_ID"

[[secrets_store_secrets]]
binding     = "GITHUB_TOKEN"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "GITHUB_TOKEN"

[[secrets_store_secrets]]
binding     = "SONARCLOUD_TOKEN"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "SONARCLOUD_TOKEN"

[[secrets_store_secrets]]
binding     = "SONARCLOUD_ORG"
store_id    = "2556bcd9458349f6b4ff2a3fc93bdba1"
secret_name = "SONARCLOUD_ORG"